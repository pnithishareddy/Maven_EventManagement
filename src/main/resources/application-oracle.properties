# Oracle Database profile. Override any value with environment variables DB_URL, DB_USER, DB_PASSWORD.
# Oracle XE 18c/21c (pluggable DB):  jdbc:oracle:thin:@//localhost:1521/XEPDB1
# Oracle XE 11g / classic SID:       jdbc:oracle:thin:@localhost:1521:XE
# Error ORA-12514 (listener does not know the service) = wrong service name or database not open.
# Check with: lsnrctl services   then copy the service name it lists into DB_URL. See docs/COMMANDS.md section 7.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/xe}
spring.datasource.username=${DB_USER:eventuser}
spring.datasource.password=${DB_PASSWORD:event123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=false
spring.datasource.hikari.maximum-pool-size=10
logging.level.com.example.eventmgmt=DEBUG
app.scheduler.complete-events-cron=0 * * * * *
app.scheduler.pool-monitor-ms=30000
app.seed.enabled=false
