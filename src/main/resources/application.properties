# ==========================================
# APPLICATION CONFIGURATION
# ==========================================

spring.application.name=event-management
server.port=8081
spring.profiles.active=dev

spring.jpa.open-in-view=false


# ==========================================
# DATABASE CONFIGURATION - H2
# ==========================================

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update


# ==========================================
# DATABASE CONNECTION POOL - HIKARICP
# ==========================================

spring.datasource.hikari.pool-name=EventHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# ==========================================
# FILE UPLOAD CONFIGURATION
# ==========================================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.upload-dir=./uploads


# ==========================================
# CACHE CONFIGURATION
# ==========================================

spring.cache.type=simple
spring.cache.cache-names=events


# ==========================================
# SCHEDULER CONFIGURATION
# ==========================================

spring.task.scheduling.pool.size=3
spring.task.scheduling.thread-name-prefix=event-sched-


# ==========================================
# ACTUATOR CONFIGURATION
# ==========================================

management.endpoints.web.base-path=/actuator

management.endpoints.web.exposure.include=health,info,metrics,caches,scheduledtasks,loggers,mappings,beans,env

management.endpoint.health.enabled=true
management.endpoint.health.show-details=always

management.endpoint.info.enabled=true
management.info.env.enabled=true

management.endpoint.metrics.enabled=true
management.endpoint.mappings.enabled=true
management.endpoint.beans.enabled=true
management.endpoint.caches.enabled=true
management.endpoint.scheduledtasks.enabled=true
management.endpoint.loggers.enabled=true
management.endpoint.env.enabled=true

info.app.name=Event Management System
info.app.version=2.0.0
info.app.description=Organizers create events; attendees register for events and sessions


# ==========================================
# OPENAPI / SWAGGER CONFIGURATION
# ==========================================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
