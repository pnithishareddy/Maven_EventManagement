spring.datasource.url=jdbc:h2:mem:eventdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
logging.level.com.example.eventmgmt=DEBUG
# scheduler runs often in dev so it is easy to demo
app.scheduler.complete-events-cron=0 * * * * *
app.scheduler.pool-monitor-ms=30000
# set to true to insert sample data on startup
app.seed.enabled=false
